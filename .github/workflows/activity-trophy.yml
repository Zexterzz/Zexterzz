
name: Atualizar Activity e Troféus

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Criar pasta profile
        run: mkdir -p profile

      - name: Gerar Activity Graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: Zexterzz
          options: theme=tokyo-night&hide_border=true&custom_title=Atividade%20no%20GitHub
          output_path: profile/activity.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar Troféus
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: username=Zexterzz&theme=onedark&column=7&margin-w=15&margin-h=15
          path: profile/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Salvar arquivos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/activity.svg profile/trophy.svg

          git commit -m "Adicionar activity e trofeus" || exit 0

          git push

