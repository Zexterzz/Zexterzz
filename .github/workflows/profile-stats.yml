name: Gerar Estatísticas do Perfil

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  gerar-estatisticas:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Criar pasta profile
        run: mkdir -p profile

      - name: Gerar estatísticas
        uses: anuraghazra/github-readme-stats@master
        with:
          username: Zexterzz
          output_path: profile/stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar linguagens
        uses: anuraghazra/github-readme-stats@master
        with:
          username: Zexterzz
          output_path: profile/top-langs.svg
          type: top-langs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar atividade
        run: |
          curl -L \
          "https://github-readme-activity-graph.vercel.app/graph?username=Zexterzz&theme=tokyo-night&hide_border=true&area=true&custom_title=Atividade%20no%20GitHub" \
          -o profile/activity.svg

      - name: Gerar troféus
        run: |
          curl -L \
          "https://github-profile-trophy.vercel.app/?username=Zexterzz&theme=tokyonight&no-frame=true&no-bg=true&margin-w=10&row=1" \
          -o profile/trophy.svg

      - name: Salvar arquivos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/

          git diff --cached --quiet || git commit -m "Atualizar estatísticas do perfil"

          git push
