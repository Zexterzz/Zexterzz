name: Gerar Estatísticas

on:
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Criar pasta
        run: mkdir -p profile

      - name: Gerar estatísticas
        run: |
          curl -L "https://github-readme-stats.vercel.app/api?username=Zexterzz&show_icons=true&theme=tokyonight&include_all_commits=true&hide_border=true" \
          -o profile/stats.svg

      - name: Gerar linguagens
        run: |
          curl -L "https://github-readme-stats.vercel.app/api/top-langs/?username=Zexterzz&layout=compact&langs_count=8&theme=tokyonight&hide_border=true" \
          -o profile/top-langs.svg

      - name: Salvar estatísticas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          git commit -m "Atualizar estatísticas do perfil" || exit 0

          git push
