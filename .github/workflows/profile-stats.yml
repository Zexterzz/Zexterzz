```yaml
name: Atualizar Estatísticas do Perfil

on:
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Testar acesso ao GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user

      - name: Criar pasta profile
        run: mkdir -p profile

      - name: Gerar stats
        run: |
          curl -L \
            "https://github-readme-stats.vercel.app/api?username=Zexterzz&show_icons=true&theme=tokyonight&hide_border=true" \
            -o profile/stats.svg

      - name: Gerar linguagens
        run: |
          curl -L \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=Zexterzz&layout=compact&langs_count=8&theme=tokyonight&hide_border=true" \
            -o profile/top-langs.svg

      - name: Salvar arquivos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/

          git commit -m "Atualizar estatisticas do perfil" || exit 0

          git push
```
