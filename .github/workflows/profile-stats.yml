```yaml
name: Atualizar Estatísticas do Perfil

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Criar pasta profile
        run: mkdir -p profile

      - name: Gerar GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Zexterzz&show_icons=true&include_all_commits=true&theme=tokyonight&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Zexterzz&layout=compact&langs_count=8&theme=tokyonight&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar Activity Graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: Zexterzz
          options: theme=tokyo-night&hide_border=true&area=true&custom_title=Atividade%20no%20GitHub
          output_path: profile/activity.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar Troféus
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: username=Zexterzz&theme=tokyonight&no-frame=true&no-bg=true&margin-w=10&row=1
          path: profile/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Salvar arquivos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          git commit -m "Atualizar estatísticas do perfil" || exit 0

          git push
```
